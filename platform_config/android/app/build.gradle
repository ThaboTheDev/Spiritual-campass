plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin
    // plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.tshk.tshk_compass"
    // Values supplied by Flutter's generated properties. If your template uses
    // literal numbers instead, replace these with them.
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.tshk.tshk_compass"
        // geolocator and flutter_compass need 23 or higher.
        // If your template uses `flutter.minSdkVersion`, add
        // `flutter.minSdkVersion=23` to android/gradle.properties instead.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        // isiZulu and English only; keeps the APK small.
        resourceConfigurations += ["en"]
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the store build.
            //       See README "Android release build".
            signingConfig = signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // No extra dependencies: everything comes from Flutter plugins.
}
