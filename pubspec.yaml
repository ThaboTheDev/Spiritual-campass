name: tshk_compass
description: >-
  TSHK Compass points the way to Ekuphumuleni, the spiritual capital, for
  Abantwana Bobukhosi Bukamoya (amasosha). English, isiZulu, Português,
  Chichewa and iciBemba, offline first.
publish_to: "none"

# versionName+versionCode: 1.0.0 (1)
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Built-in Material / Cupertino strings in isiZulu and Portuguese.
  flutter_localizations:
    sdk: flutter

  # State management.
  flutter_riverpod: ^2.6.1

  # Device sensors and location.
  flutter_compass: ^0.8.1          # rung 1: fused heading
  sensors_plus: ^7.1.0             # rungs 2–3: magnetometer / accelerometer / gyroscope, level bubble
  geolocator: 14.0.1              # location + rung 4: GPS course
  wakelock_plus: 1.8.0            # keep the screen on while the compass runs
  device_info_plus: ^13.2.0        # low / normal performance profile

  # Map.
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^8.2.2

  # Outbound intents: directions, phone calls, attribution links.
  url_launcher: ^6.3.2

  # Persisted manual location, locked msamo direction, language, simple mode.
  shared_preferences: ^2.5.5

  # Membership session tokens (feature behind kMembershipEnabled).
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0

  # Serif titles + IBM Plex body and monospace.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1

  # Run `dart run flutter_launcher_icons` and `dart run flutter_native_splash:create`.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    # 2.0x / 3.0x variants under assets/2.0x and assets/3.0x are picked up
    # automatically.
    - assets/logo.png
    - assets/centres.json
    - assets/towns.json
    - assets/translations.json
    # Bundled fonts (run tool/fetch_fonts.sh once). google_fonts looks the
    # files up in the asset manifest by "<Family>-<Variant>.ttf", so they are
    # declared as plain assets, not under `fonts:` — a missing file then
    # degrades to the platform font instead of failing the build.
    - assets/fonts/

# ---------------------------------------------------------------------------
# Launcher icon: `dart run flutter_launcher_icons`
# Replace assets/logo.png with the official crest before generating.
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  adaptive_icon_background: "#0f131c"
  adaptive_icon_foreground: "assets/logo.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# ---------------------------------------------------------------------------
# Native splash: `dart run flutter_native_splash:create`
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#0f131c"
  image: "assets/logo.png"
  android: true
  ios: true
  web: false
  color_dark: "#0f131c"
  image_dark: "assets/logo.png"
  android_12:
    color: "#0f131c"
    image: "assets/logo.png"
