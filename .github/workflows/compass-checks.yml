name: Compass checks

on:
  pull_request:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compass-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analysis and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: python3 tool/check_compass_config.py
      - run: python3 -m unittest discover -s tool/tests -v
      - id: dependencies
        run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter test --reporter expanded

  android:
    name: Android bridge compilation and native regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-arm64
      - name: Native accuracy adapter tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

  ios:
    name: iOS bridge compilation and native frame regression tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select supported iOS SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
      - run: flutter build ios --simulator --debug
      - name: Native Core Motion frame tests
        shell: bash
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k in sorted(d["devices"],reverse=True) if "iOS" in k for v in d["devices"][k] if v.get("isAvailable") and "iPhone" in v["name"]))')"
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "id=$DEVICE_ID" -resultBundlePath build/CompassNativeTests.xcresult \
            CODE_SIGNING_ALLOWED=NO
